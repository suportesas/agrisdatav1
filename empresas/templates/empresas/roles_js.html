<script>
// ─────────────────────────────────────────────────────────────────────────────
// Roles JS — carregamento e edição de permissões
// ─────────────────────────────────────────────────────────────────────────────

let currentRoleId = null;
let pendingChanges = 0;
// URL base lida do data-attribute para evitar avaliação server-side no JS
const PERM_URL_TEMPLATE = document.getElementById('roles-url-config')?.dataset.permsUrl
  || "{% url 'empresas:role_permissions' role_id=0 %}";

// Nomes amigáveis para modelos comuns (app:model → label PT)
const MODEL_LABELS = {
  // Cadastros
  'cadastros:fazenda': 'Fazenda', 'cadastros:enderecofazenda': 'Endereço de Fazenda',
  'cadastros:contatofazenda': 'Contato de Fazenda', 'cadastros:contabancariafazenda': 'Banco de Fazenda',
  'cadastros:documentofazenda': 'Documento de Fazenda', 'cadastros:cliente': 'Cliente',
  'cadastros:produtor': 'Produtor', 'cadastros:fornecedor': 'Fornecedor',
  'cadastros:transportadora': 'Transportadora', 'cadastros:area': 'Área Agrícola',
  'cadastros:talhao': 'Talhão', 'cadastros:cultura': 'Cultura', 'cadastros:safra': 'Safra',
  'cadastros:praga': 'Praga', 'cadastros:requisicao': 'Requisição',
  'cadastros:vendedor': 'Vendedor', 'cadastros:cfop': 'CFOP', 'cadastros:ncm': 'NCM',
  // RH
  'rh:funcionario': 'Funcionário', 'rh:funcaofuncionario': 'Função/Cargo',
  'rh:feriasfuncionario': 'Férias', 'rh:afastamentofuncionario': 'Afastamento',
  'rh:rescisaocontrato': 'Rescisão', 'rh:vinculocontrato': 'Vínculo Contratual',
  'rh:solicitacaoaso': 'Solicitação ASO', 'rh:laudorisco': 'Laudo de Risco',
  // Operações de Campo
  'operacoes_campo:ordemservico': 'Ordem de Serviço', 'operacoes_campo:custotalhao': 'Custo por Talhão',
  'operacoes_campo:etapacolheita': 'Etapa de Colheita', 'operacoes_campo:registrocadernocampo': 'Caderno de Campo',
  'operacoes_campo:registropluviometria': 'Pluviometria', 'operacoes_campo:planejamentocustosafra': 'Planejamento de Custo',
  // Produtos / Estoque
  'produtos:produto': 'Produto', 'produtos:unidademedida': 'Unidade de Medida',
  'estoque:movimentacaoestoque': 'Movimentação de Estoque', 'estoque:armazem': 'Armazém',
  // Compras
  'compras:pedidocompra': 'Pedido de Compra', 'compras:recebimento': 'Recebimento de Compra',
  // Financeiro
  'financeiro:contapagar': 'Conta a Pagar', 'financeiro:contareceber': 'Conta a Receber',
  'financeiro:parcelacontareceber': 'Parcela a Receber',
  // Faturamento
  'faturamento:notafiscal': 'Nota Fiscal (NF-e)', 'faturamento:invoice': 'Invoice de Exportação',
  // Vendas
  'vendas:pedidovenda': 'Pedido de Venda',
};

function getModelLabel(appLabel, modelName) {
  const key = appLabel + ':' + modelName;
  return MODEL_LABELS[key] || modelName.charAt(0).toUpperCase() + modelName.slice(1).replace(/_/g, ' ');
}

function getCsrfToken() {
  const match = document.cookie.match(/csrftoken=([^;]+)/);
  return match ? match[1] : '';
}

function showToast(message, type = 'success') {
  const icons = { success: 'bi-check-circle', danger: 'bi-x-circle', info: 'bi-info-circle' };
  const existing = document.querySelector('.roles-toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'roles-toast ' + type;
  toast.innerHTML = `<i class="bi ${icons[type] || icons.success}"></i> ${message}`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

function updateUnsavedBadge() {
  const badge = document.getElementById('unsaved-badge');
  const countEl = document.getElementById('unsaved-count');
  if (!badge) return;
  if (pendingChanges > 0) {
    badge.classList.remove('hidden');
    if (countEl) countEl.textContent = pendingChanges;
  } else {
    badge.classList.add('hidden');
  }
}

function setSaveEnabled(enabled) {
  ['btn-save-perms', 'btn-save-perms-bottom'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.disabled = !enabled;
  });
}

function updateModuleCount(moduleName) {
  const tbody = document.getElementById('perms-tbody');
  if (!tbody) return;
  const rows = tbody.querySelectorAll(`tr[data-module="${moduleName}"]`);
  let total = 0, active = 0;
  rows.forEach(row => {
    row.querySelectorAll('.perm-cb').forEach(cb => {
      total++;
      if (cb.checked) active++;
    });
  });
  const countEl = document.querySelector(`.module-count[data-module="${moduleName}"]`);
  if (countEl) {
    countEl.textContent = active + '/' + total;
    countEl.className = 'module-count' + (active === total && total > 0 ? ' full' : active === 0 ? ' empty' : '');
  }
}

function updateAllModuleCounts() {
  const tbody = document.getElementById('perms-tbody');
  if (!tbody) return;
  const modules = new Set();
  tbody.querySelectorAll('tr[data-module]').forEach(r => modules.add(r.dataset.module));
  modules.forEach(m => updateModuleCount(m));

  // Atualiza total geral
  const allCbs = tbody.querySelectorAll('.perm-cb');
  const allActive = tbody.querySelectorAll('.perm-cb:checked');
  const label = document.getElementById('perms-total-label');
  if (label) label.textContent = allActive.length + ' de ' + allCbs.length + ' permissões ativas';
}

async function loadPermissions(roleId) {
  currentRoleId = roleId;
  pendingChanges = 0;
  updateUnsavedBadge();
  setSaveEnabled(false);

  // Mostra painel e loading
  document.getElementById('perms-empty').classList.add('d-none');
  document.getElementById('perms-content').classList.remove('d-none');
  document.getElementById('perms-loading').classList.remove('d-none');
  document.getElementById('perms-table-wrap').classList.add('d-none');

  try {
    const url = PERM_URL_TEMPLATE.replace('/0/', '/' + roleId + '/');
    const resp = await fetch(url, {
      headers: { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json' }
    });
    if (!resp.ok) {
      const text = await resp.text();
      document.getElementById('perms-loading').classList.add('d-none');
      document.getElementById('perms-table-wrap').classList.remove('d-none');
      document.getElementById('perms-tbody').innerHTML =
        `<tr><td colspan="5"><div class="alert alert-danger m-3">
          <i class="bi bi-x-circle me-2"></i>Erro ao carregar permissões (${resp.status}).
        </div></td></tr>`;
      return;
    }
    const data = await resp.json();
    renderPermissions(roleId, data.permissions || []);
  } catch (err) {
    document.getElementById('perms-loading').classList.add('d-none');
    document.getElementById('perms-table-wrap').classList.remove('d-none');
    document.getElementById('perms-tbody').innerHTML =
      `<tr><td colspan="5"><div class="alert alert-danger m-3">
        <i class="bi bi-x-circle me-2"></i>Erro de conexão.
      </div></td></tr>`;
  }
}

function renderPermissions(roleId, perms) {
  // Atualiza nome do role no cabeçalho
  const roleItem = document.querySelector(`.role-item[data-role-id="${roleId}"]`);
  const roleName = roleItem ? roleItem.querySelector('.role-name').textContent.trim() : 'Função';
  document.getElementById('perms-role-name').textContent = roleName;
  document.getElementById('perms-role-meta').textContent = 'Clique nos checkboxes para editar permissões';

  const tbody = document.getElementById('perms-tbody');
  tbody.innerHTML = '';

  if (!perms.length) {
    tbody.innerHTML = '<tr><td colspan="5"><div class="alert alert-info m-3">Nenhuma permissão disponível.</div></td></tr>';
    document.getElementById('perms-loading').classList.add('d-none');
    document.getElementById('perms-table-wrap').classList.remove('d-none');
    return;
  }

  // Agrupa por app_label
  const apps = {};
  perms.forEach(p => {
    if (!apps[p.app_label]) apps[p.app_label] = { nome: p.app_nome || p.app_label, items: [] };
    apps[p.app_label].items.push(p);
  });

  Object.entries(apps).forEach(([app, group]) => {
    const moduleName = app;
    // Cabeçalho do módulo
    const headerRow = document.createElement('tr');
    headerRow.className = 'perms-module-header';
    headerRow.innerHTML = `
      <td colspan="5">
        <div class="d-flex align-items-center justify-content-between gap-2">
          <span class="fw-bold">${group.nome}</span>
          <div class="d-flex align-items-center gap-2">
            <span class="module-count empty" data-module="${moduleName}">0/0</span>
            <button type="button"
                    class="btn btn-link btn-sm p-0 fw-semibold text-decoration-none module-check-all"
                    data-module="${moduleName}"
                    style="font-size:.78rem;color:#7c3aed;">
              Marcar todos
            </button>
            <button type="button"
                    class="btn btn-link btn-sm p-0 fw-semibold text-decoration-none module-uncheck-all"
                    data-module="${moduleName}"
                    style="font-size:.78rem;color:#6b7280;">
              Desmarcar
            </button>
          </div>
        </div>
      </td>`;
    tbody.appendChild(headerRow);

    // Linhas de modelo
    group.items.forEach(item => {
      const row = document.createElement('tr');
      row.dataset.module = moduleName;
      const label = getModelLabel(app, item.model);
      const p = item.perms;
      row.innerHTML = `
        <td><span class="model-label">${label}</span></td>
        <td class="text-center">
          <input type="checkbox" class="perm-cb" ${p.add ? 'checked' : ''}
                 data-codename="add_${item.model}" title="Criar ${label}">
        </td>
        <td class="text-center">
          <input type="checkbox" class="perm-cb" ${p.change ? 'checked' : ''}
                 data-codename="change_${item.model}" title="Editar ${label}">
        </td>
        <td class="text-center">
          <input type="checkbox" class="perm-cb" ${p.delete ? 'checked' : ''}
                 data-codename="delete_${item.model}" title="Excluir ${label}">
        </td>
        <td class="text-center">
          <input type="checkbox" class="perm-cb" ${p.view ? 'checked' : ''}
                 data-codename="view_${item.model}" title="Ver ${label}">
        </td>`;
      tbody.appendChild(row);
    });
  });

  // Snapshot inicial
  const initialState = getPermState();

  // Evento de mudança nos checkboxes
  tbody.addEventListener('change', function (e) {
    if (!e.target.classList.contains('perm-cb')) return;
    const module = e.target.closest('tr[data-module]')?.dataset.module;
    if (module) updateModuleCount(module);

    const current = getPermState();
    pendingChanges = Object.keys(current).filter(k => current[k] !== initialState[k]).length;
    updateUnsavedBadge();
    setSaveEnabled(true);
    updateAllModuleCounts();
  });

  // Marcar/desmarcar todos por módulo
  tbody.addEventListener('click', function (e) {
    const checkBtn = e.target.closest('.module-check-all');
    const uncheckBtn = e.target.closest('.module-uncheck-all');
    if (checkBtn) {
      const m = checkBtn.dataset.module;
      tbody.querySelectorAll(`tr[data-module="${m}"] .perm-cb`).forEach(cb => cb.checked = true);
      updateModuleCount(m);
      setSaveEnabled(true);
      updateAllModuleCounts();
      pendingChanges++;
      updateUnsavedBadge();
    }
    if (uncheckBtn) {
      const m = uncheckBtn.dataset.module;
      tbody.querySelectorAll(`tr[data-module="${m}"] .perm-cb`).forEach(cb => cb.checked = false);
      updateModuleCount(m);
      setSaveEnabled(true);
      updateAllModuleCounts();
      pendingChanges++;
      updateUnsavedBadge();
    }
  });

  // Selecionar/desmarcar todos globais
  const btnAll    = document.getElementById('btn-select-all');
  const btnNone   = document.getElementById('btn-deselect-all');
  if (btnAll)  btnAll.onclick  = () => { tbody.querySelectorAll('.perm-cb').forEach(c => c.checked = true);  setSaveEnabled(true); pendingChanges++; updateUnsavedBadge(); updateAllModuleCounts(); };
  if (btnNone) btnNone.onclick = () => { tbody.querySelectorAll('.perm-cb').forEach(c => c.checked = false); setSaveEnabled(true); pendingChanges++; updateUnsavedBadge(); updateAllModuleCounts(); };

  // Salvar
  ['btn-save-perms', 'btn-save-perms-bottom'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.onclick = () => savePermissions(roleId);
  });

  // Exibe tabela
  document.getElementById('perms-loading').classList.add('d-none');
  document.getElementById('perms-table-wrap').classList.remove('d-none');
  updateAllModuleCounts();
}

function getPermState() {
  const state = {};
  document.querySelectorAll('#perms-tbody .perm-cb').forEach(cb => {
    state[cb.dataset.codename] = cb.checked;
  });
  return state;
}

async function savePermissions(roleId) {
  const codenames = [];
  document.querySelectorAll('#perms-tbody .perm-cb:checked').forEach(cb => {
    codenames.push(cb.dataset.codename);
  });

  ['btn-save-perms', 'btn-save-perms-bottom'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Salvando…';
    }
  });

  try {
    const url = PERM_URL_TEMPLATE.replace('/0/', '/' + roleId + '/');
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken(), 'X-Requested-With': 'XMLHttpRequest' },
      body: JSON.stringify({ permissions: codenames }),
    });
    const data = await resp.json();
    if (data.ok) {
      pendingChanges = 0;
      updateUnsavedBadge();
      setSaveEnabled(false);
      ['btn-save-perms', 'btn-save-perms-bottom'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.innerHTML = '<i class="bi bi-floppy me-1"></i> Salvar';
      });
      showToast(`${data.updated} permissão(ões) salva(s) com sucesso.`, 'success');
    } else {
      throw new Error(data.error || 'Erro desconhecido');
    }
  } catch (err) {
    showToast('Erro ao salvar: ' + err.message, 'danger');
    ['btn-save-perms', 'btn-save-perms-bottom'].forEach(id => {
      const btn = document.getElementById(id);
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-floppy me-1"></i> Salvar'; }
    });
  }
}
</script>
