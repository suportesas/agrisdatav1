{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal do Campo — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0e4a26 0%, #1a6e3c 50%, #2d9e5f 100%);
      font-family: 'Segoe UI', sans-serif;
    }
    .login-box {
      background: #fff;
      border-radius: 1.5rem;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    .login-icon {
      width: 64px; height: 64px;
      background: #e8f5ee;
      border-radius: 1rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      color: #1a6e3c;
      margin: 0 auto 1rem;
    }
    .btn-entrar {
      background: #1a6e3c;
      color: #fff;
      border-radius: .75rem;
      font-weight: 600;
      font-size: 1rem;
      padding: .65rem;
    }
    .btn-entrar:hover { background: #155c32; color: #fff; }
    .form-control {
      border-radius: .75rem;
      font-size: 1rem;
      padding: .65rem 1rem;
    }
    .form-label { font-weight: 600; font-size: .85rem; color: #555; }
    /* PIN: input grande */
    #pin { letter-spacing: .3em; font-size: 1.4rem; text-align: center; }
  </style>
</head>
<body>

<div class="login-box">
  <div class="login-icon">
    <i class="bi bi-person-badge-fill"></i>
  </div>
  <h5 class="text-center fw-bold mb-1">Portal do Campo</h5>
  <p class="text-center text-muted small mb-4">Acesse suas Ordens de Serviço</p>

  {% if error %}
  <div class="alert alert-danger rounded-3 py-2 small">
    <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
  </div>
  {% endif %}

  <form method="post" autocomplete="off">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label" for="cpf"><i class="bi bi-person me-1 text-success"></i>CPF</label>
      <input type="tel" name="cpf" id="cpf" class="form-control"
             placeholder="000.000.000-00" inputmode="numeric"
             maxlength="14" required autofocus>
    </div>

    <div class="mb-4">
      <label class="form-label" for="pin"><i class="bi bi-lock me-1 text-success"></i>PIN</label>
      <input type="password" name="pin" id="pin" class="form-control"
             placeholder="••••" inputmode="numeric"
             maxlength="8" required>
      <div class="form-text text-center">PIN definido pelo gestor</div>
    </div>

    <button type="submit" class="btn btn-entrar w-100">
      <i class="bi bi-arrow-right-circle me-1"></i>Entrar
    </button>
  </form>
</div>

<script>
/* Auto-format CPF */
document.getElementById('cpf').addEventListener('input', function() {
  let v = this.value.replace(/\D/g, '').slice(0, 11);
  if (v.length > 9) v = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9);
  else if (v.length > 6) v = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6);
  else if (v.length > 3) v = v.slice(0,3)+'.'+v.slice(3);
  this.value = v;
});
</script>
</body>
</html>
