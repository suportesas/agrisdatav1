{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h3>{{ title|default:'Nova Comissão' }}</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <a href="{% url 'cadastros:comissao_list' %}" class="btn btn-secondary">Cancelar</a>
    <button type="submit" class="btn btn-primary">Salvar</button>
  </form>
</div>
{% endblock %}
