{% extends 'base.html' %}
{% load static %}

{% block title %}{{ action }} | {{ safra }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row">
    <div class="col-md-8 offset-md-2">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">{{ action }} — {{ safra }}</h5>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            {% include 'cadastros/safra/partials/safra_plan_form_fields.html' %}
            <div class="mt-3">
              <button class="btn btn-success" type="submit">Salvar</button>
              <a class="btn btn-secondary" href="{% url 'cadastros:safra_detail' safra.pk %}">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
