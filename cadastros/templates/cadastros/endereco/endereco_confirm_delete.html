{% extends 'base.html' %}
{% block title %}Excluir Endereço | Agrisdata{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-lg text-center p-4">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 4rem;"></i>
        <h4 class="mt-3">Excluir Endereço?</h4>
        <p class="text-muted">{{ endereco.get_endereco_completo }}</p>
        <form method="post" class="d-flex gap-3 justify-content-center mt-3">
          {% csrf_token %}
          {% if fornecedor %}
            <a href="{% url 'cadastros:fornecedor_detail' fornecedor.pk %}" class="btn btn-secondary">Cancelar</a>
          {% elif cliente %}
            <a href="{% url 'cadastros:cliente_detail' cliente.pk %}" class="btn btn-secondary">Cancelar</a>
          {% else %}
            <a href="{% url 'cadastros:fazenda_detail' fazenda.pk %}" class="btn btn-secondary">Cancelar</a>
          {% endif %}
          <button type="submit" class="btn btn-danger">Sim, Excluir</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
