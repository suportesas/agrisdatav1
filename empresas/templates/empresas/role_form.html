{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="card">
    <div class="card-body">
      <h4>{{ action }} Função</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Nome</label>
          {{ form.name }}
          {% if form.name.errors %}<div class="text-danger small">{{ form.name.errors }}</div>{% endif %}
        </div>
        <div class="mb-3">
          <label class="form-label">Descrição</label>
          {{ form.description }}
        </div>
        <div class="d-flex gap-2">
          <a href="{% url 'empresas:roles_list' %}" class="btn btn-outline-secondary">Voltar</a>
          <button class="btn btn-success">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
