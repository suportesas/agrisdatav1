name: E2E Playwright

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest

    env:
      DJANGO_ALLOW_ASYNC_UNSAFE: '1'
      # settings.py requires SECRET_KEY whenever DEBUG is not truthy
      DEBUG: 'True'
      SECRET_KEY: ci-e2e-insecure-secret-key
      # Optional — avoids the "sensitive fields not encrypted" warning during tests
      FIELD_ENCRYPTION_KEY: 'RcxBSziF9kIyGkcOPGSUsA0JYHRVfv3zJ5FfwHktoCQ='
      # Postgres service credentials (used by Django settings when PG_NAME is provided)
      PG_NAME: erp_agricola
      PG_USER: erp_user
      PG_PASSWORD: secret
      PG_HOST: localhost
      PG_PORT: 5432

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_agricola
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp_user -d erp_agricola" --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          # Installs browsers and apt dependencies for Playwright
          python -m playwright install --with-deps

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run unit tests
        run: |
          pytest -q

      - name: Run E2E tests
        id: run-e2e
        continue-on-error: true
        run: |
          pytest tests/e2e -q

      - name: Upload E2E artifacts on failure
        if: ${{ steps.run-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: tests/e2e/artifacts/**

      - name: Fail if E2E failed
        if: ${{ steps.run-e2e.outcome == 'failure' }}
        run: |
          echo "E2E tests failed — artifacts uploaded" >&2
          exit 1
