{% extends 'base.html' %}

{% block content %}
<div class="container mt-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Marcas</h1>
    <a href="{% url 'produtos:marca_create' %}" class="btn btn-primary">
      <i class="bi bi-plus-circle"></i> Nova Marca
    </a>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="get" class="mb-3">
        <div class="input-group">
          <input type="text" name="q" class="form-control" placeholder="Buscar por nome..." value="{{ query }}">
          <button class="btn btn-outline-secondary" type="submit">
            <i class="bi bi-search"></i> Buscar
          </button>
        </div>
      </form>

      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Status</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody>
            {% for marca in marcas %}
            <tr>
              <td>{{ marca.nome }}</td>
              <td>
                {% if marca.ativo %}
                  <span class="badge bg-success">Ativo</span>
                {% else %}
                  <span class="badge bg-secondary">Inativo</span>
                {% endif %}
              </td>
              <td class="text-end">
                <a href="{% url 'produtos:marca_update' marca.pk %}" class="btn btn-sm btn-warning">
                  <i class="bi bi-pencil"></i> Editar
                </a>
                <form method="post" action="{% url 'produtos:marca_toggle_ativo' marca.pk %}" class="d-inline">
                  {% csrf_token %}
                  <button type="submit" class="btn btn-sm {% if marca.ativo %}btn-secondary{% else %}btn-success{% endif %}">
                    {% if marca.ativo %}<i class="bi bi-slash-circle"></i> Desativar{% else %}<i class="bi bi-check-circle"></i> Ativar{% endif %}
                  </button>
                </form>
              </td>
            </tr>
            {% empty %}
            <tr>
              <td colspan="3" class="text-center">Nenhuma marca cadastrada.</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
