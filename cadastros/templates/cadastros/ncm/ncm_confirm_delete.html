{% extends 'base.html' %}

{% block content %}
<div class="container mt-3">
  <h1>Confirmar exclusão</h1>
  <p>Tem certeza que deseja excluir o NCM <strong>{{ ncm.codigo }} - {{ ncm.nome }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Excluir</button>
    <a class="btn btn-secondary ms-2" href="{% url 'cadastros:ncm_list' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
