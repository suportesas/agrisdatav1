{% extends 'base.html' %}

{% block title %}Finalizar Auditoria {{ auditoria.ano }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="card p-4">
    <h4 class="mb-3">Finalizar Auditoria {{ auditoria.ano }}</h4>
    <p class="text-muted">Ao finalizar, a auditoria será marcada como concluída.</p>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2">
        <a href="{% url 'patrimonio:auditoria_detail' auditoria.pk %}" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-success">Finalizar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
