services:
  app:
    build: .
    container_name: agrisdata_app
    env_file:
      - .env.docker
    volumes:
      - ./staticfiles:/app/agrisdata/staticfiles
      - ./media:/app/agrisdata/media
      - ./logs:/app/agrisdata/logs
    ports:
      - "8000:8000"
    depends_on: []
    command: ["gunicorn", "core.wsgi:application", "--bind", "0.0.0.0:8000"]

