{% extends 'portal_produtor/base.html' %}

{% block title %}Trocar Senha{% endblock %}

{% block content %}
<div class="container py-4">
  <h2 class="mb-4"><i class="bi bi-key me-2"></i>Trocar Senha</h2>
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="text-end">
          <button type="submit" class="btn btn-primary">Salvar Nova Senha</button>
          <a href="{% url 'portal_produtor:perfil' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
