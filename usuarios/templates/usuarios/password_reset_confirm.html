{% extends 'base_login.html' %}
{% block title %}Nova senha - ERP Agrícola{% endblock %}
{% block content %}
<div class="login-card">
    <h4>Nova senha</h4>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100">Alterar senha</button>
    </form>
</div>
{% endblock %}
