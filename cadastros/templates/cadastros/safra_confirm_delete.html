{% extends 'base.html' %}

{% block content %}
<div class="container">
  <h1>Excluir Safra</h1>
  <p>Tem certeza que deseja excluir a safra "{{ safra }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Excluir</button>
    <a class="btn btn-secondary" href="{% url 'cadastros:safra_detail' safra.pk %}">Cancelar</a>
  </form>
</div>
{% endblock %}
