{% extends 'base.html' %}

{% block title %}{{ action }}{% endblock %}
{% block page_title %}{{ action }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-3">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a href="{% if booking %}{% url 'exportacao:booking_detail' booking.pk %}{% else %}{% url 'exportacao:container_list' %}{% endif %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
