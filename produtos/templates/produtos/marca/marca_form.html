{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
  <div class="form-header">
    <div class="form-header-top">
      <div class="form-header-title">
        <span class="icon-badge"><i class="bi bi-tag"></i></span>
        <h2>{{ action }} Marca</h2>
      </div>
    </div>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="form-section">
      <div class="form-section-body">
        <div class="form-grid">
          <div class="field col-6">
            <label class="form-label">{{ form.nome.label }}</label>
            {{ form.nome }}
            {% if form.nome.errors %}<div class="error-msg"><i class="bi bi-exclamation-circle"></i> {{ form.nome.errors|striptags }}</div>{% endif %}
          </div>
          <div class="field col-12">
            <div class="switch-row">
              <label class="switch">
                {{ form.ativo }}
                <span class="slider"></span>
              </label>
              <label class="switch-label" for="{{ form.ativo.id_for_label }}">{{ form.ativo.label }}</label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="app-footer-bar">
      <a href="{% url 'produtos:marca_list' %}" class="btn btn-outline">Cancelar</a>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
