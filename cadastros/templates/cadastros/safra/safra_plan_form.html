{% extends 'base.html' %}
{% load static %}

{% block title %}{{ action }} | {{ safra }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="form-header">
    <div class="form-header-top">
      <div class="form-header-title">
        <span class="icon-badge"><i class="bi bi-clipboard-data"></i></span>
        <h2>{{ action }} — {{ safra }}</h2>
      </div>
    </div>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="form-section">
      <div class="form-section-body">
        {% include 'cadastros/safra/partials/safra_plan_form_fields.html' %}
      </div>
    </div>

    <div class="app-footer-bar">
      <a href="{% url 'cadastros:safra_detail' safra.pk %}" class="btn btn-outline">Cancelar</a>
      <button class="btn btn-primary" type="submit">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
