<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ERP Agrícola - Login{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #2e8b57, #4caf50);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h4 {
            text-align: center;
            margin-bottom: 25px;
            color: #2e8b57;
        }

        footer {
            position: fixed;
            bottom: 15px;
            font-size: 0.9em;
            color: rgba(115, 219, 155, 0.8);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    
    {% block content %}{% endblock %}
    <footer class="text-center w-100"">
        <p>© {{ now|date:"Y" }} NexSafra - Todos os direitos reservados</p>
    </footer>

    
</body>
</html>
