<script>
// Ícones por módulo
const MODULE_ICONS = {
  'cadastros': '📋',
  'produtos': '📦',
  'estoque': '📊',
  'compras': '🛒',
  'empresas': '🏢',
  'usuarios': '👥',
  'auth': '🔐',
  'dashboard': '�',
  'vendas': '💰',
};

async function loadPermissions(roleId) {
  console.log('loadPermissions called', roleId);
  const area = document.getElementById('permissions-area');
  area.innerHTML = '<div class="text-center py-5 loading-skeleton"><div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;"><span class="visually-hidden">Carregando...</span></div><p class="text-muted">Carregando permissões...</p></div>';
  
  try{
    const resp = await fetch("{% url 'empresas:role_permissions' role_id=0 %}".replace('/0/','/'+roleId+'/'), {headers:{'X-Requested-With':'XMLHttpRequest'}});
    if(!resp.ok){
      const text = await resp.text();
      console.error('Erro ao obter permissões:', resp.status, text);
      if(resp.status === 403){
        area.innerHTML = '<div class="alert alert-warning"><i class="bi bi-exclamation-triangle"></i> Você não tem permissão para visualizar estas permissões.</div>';
      } else {
        area.innerHTML = '<div class="alert alert-danger"><i class="bi bi-x-circle"></i> Erro ao carregar permissões</div>';
      }
      try{
        fetch('/__e2e_log__', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({level: 'error', msg: 'role_permissions_error', status: resp.status, text: text, roleId: roleId})
        });
      }catch(e){}
      return;
    }

    const data = await resp.json();
    const perms = data.permissions || [];

    const selCard = document.querySelector('.role-card[data-role-id="'+roleId+'"]');
    const roleName = selCard ? selCard.querySelector('.role-name').textContent.trim() : '';

    if(!perms.length){
      area.innerHTML = '<div class="alert alert-info"><i class="bi bi-info-circle"></i> Nenhuma permissão disponível</div>';
      area.innerHTML += `<h2 class="mt-2">Permissões ${roleName ? '— <span id="selected-role-name">'+roleName+'</span>' : ''}</h2>`;
      return;
    }

    // Agrupa por app_label
    const groupedByApp = {};
    perms.forEach(item => {
      const app = item.app_label;
      if (!groupedByApp[app]) {
        groupedByApp[app] = [];
      }
      groupedByApp[app].push(item);
    });

    // Monta HTML com tabela moderna
    let html = '';
    
    // Barra de ações fixa no topo
    html += `
      <div class="actions-bar">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div>
            <h5 class="mb-1"><i class="bi bi-sliders"></i> Ações Rápidas</h5>
            <p class="text-muted small mb-0">Configure as permissões para esta função</p>
          </div>
          <div class="d-flex gap-2 flex-wrap">
            <button id="select-all" class="btn btn-outline-primary btn-sm">
              <i class="bi bi-check-all"></i> Marcar Todas
            </button>
            <button id="deselect-all" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-x-lg"></i> Desmarcar Todas
            </button>
            <button id="save-perms" class="btn btn-save-perms">
              <i class="bi bi-save"></i> Salvar Permissões
            </button>
          </div>
        </div>
        <div id="status-message" role="status" aria-live="polite" class="mt-2 visually-hidden"></div>
      </div>
    `;

    // Tabela com permissões agrupadas por módulo
    html += `<div class="permissions-table-wrapper">`;
    html += `  <div class="table-scroll">`;
    html += `    <table class="permissions-table table table-hover mb-0">`;
    html += `      <thead>`;
    html += `        <tr>`;
    html += `          <th style="width: 40%;">Módulo / Modelo</th>`;
    html += `          <th class="text-center" style="width: 15%;"><span class="permission-icon icon-add"><i class="bi bi-plus-circle"></i></span>Cadastrar</th>`;
    html += `          <th class="text-center" style="width: 15%;"><span class="permission-icon icon-change"><i class="bi bi-pencil"></i></span>Editar</th>`;
    html += `          <th class="text-center" style="width: 15%;"><span class="permission-icon icon-delete"><i class="bi bi-trash"></i></span>Excluir</th>`;
    html += `          <th class="text-center" style="width: 15%;"><span class="permission-icon icon-view"><i class="bi bi-eye"></i></span>Visualizar</th>`;
    html += `        </tr>`;
    html += `      </thead>`;
    html += `      <tbody>`;
    
    // Renderiza por módulo
    Object.keys(groupedByApp).sort().forEach(app => {
      const items = groupedByApp[app];
      const icon = MODULE_ICONS[app] || '📌';
      const appLabel = app.charAt(0).toUpperCase() + app.slice(1);
      
      // Linha de cabeçalho do módulo
      html += `<tr class="module-group-header">`;
      html += `  <td colspan="5"><span class="module-icon-large">${icon}</span><strong>${appLabel}</strong> <span class="badge bg-light text-dark ms-2">${items.length} modelo${items.length > 1 ? 's' : ''}</span></td>`;
      html += `</tr>`;
      
      // Linhas de cada modelo
      items.forEach(item => {
        const k = item.key;
        const model = item.model;
        const display = item.display || (item.app_label + '.' + model);
        const add = item.perms.add ? 'checked' : '';
        const change = item.perms.change ? 'checked' : '';
        const del = item.perms.delete ? 'checked' : '';
        const view = item.perms.view ? 'checked' : '';
        
        html += `<tr data-key="${k}" data-model="${model}">`;
        html += `  <td><strong>${display}</strong></td>`;
        html += `  <td class="text-center"><input type="checkbox" class="permission-checkbox" name="add" ${add} aria-label="${display} - Cadastrar"></td>`;
        html += `  <td class="text-center"><input type="checkbox" class="permission-checkbox" name="change" ${change} aria-label="${display} - Editar"></td>`;
        html += `  <td class="text-center"><input type="checkbox" class="permission-checkbox" name="delete" ${del} aria-label="${display} - Excluir"></td>`;
        html += `  <td class="text-center"><input type="checkbox" class="permission-checkbox" name="view" ${view} aria-label="${display} - Visualizar"></td>`;
        html += `</tr>`;
      });
    });
    
    html += `      </tbody>`;
    html += `    </table>`;
    html += `  </div>`;
    html += `</div>`;
    
    // Ações de template no final
    html += `
      <div class="actions-bar">
        <div class="row g-3">
          <div class="col-md-12">
            <h6 class="mb-3"><i class="bi bi-file-earmark-code"></i> Gerenciar Templates</h6>
            <div class="d-flex gap-2 flex-wrap align-items-center">
              <button id="save-template" class="btn btn-outline-primary" title="Salvar como Template">
                <i class="bi bi-bookmark-plus"></i> Salvar como Template
              </button>
              <span id="save-template-loading" class="spinner-border spinner-border-sm visually-hidden" role="status"></span>
              
              <select id="template-select" class="form-select" style="max-width: 300px;">
                <option value="">-- Selecionar Template --</option>
              </select>
              <span id="template-loading" class="spinner-border spinner-border-sm visually-hidden" role="status"></span>
              
              <button id="apply-template" class="btn btn-outline-success" title="Aplicar template" disabled>
                <i class="bi bi-arrow-down-circle"></i> Aplicar Template
              </button>
              
              <button id="export-perms" class="btn btn-outline-secondary" title="Exportar permissões">
                <i class="bi bi-download"></i> Exportar JSON
              </button>
            </div>
          </div>
        </div>
      </div>
    `;

    area.innerHTML = html;

    // Mark selected card visually
    try{ 
      document.querySelectorAll('.role-card').forEach(r=>r.classList.remove('selected')); 
      const sel = document.querySelector('.role-card[data-role-id="'+roleId+'"]'); 
      if(sel) sel.classList.add('selected'); 
      try{ if(window.applyRolesHideState) window.applyRolesHideState(); }catch(e){} 
    }catch(e){}

    // Event listeners
    document.getElementById('save-perms').onclick = function(){ savePermissions(roleId) };
    document.getElementById('export-perms').onclick = function(){ exportPermissions(); };
    document.getElementById('save-template').onclick = function(){ saveAsTemplate(roleId) };
    document.getElementById('apply-template').onclick = function(){ applySelectedTemplate(roleId) };
    document.getElementById('select-all').onclick = selectAllPermissions;
    document.getElementById('deselect-all').onclick = deselectAllPermissions;

    // Carrega templates
    loadTemplatesIntoSelect(roleId);
    loadTemplatesIntoBulkSelect();

  }catch(err){
    console.error('loadPermissions error', err);
    area.innerHTML = '<div class="alert alert-danger"><i class="bi bi-x-circle"></i> Erro ao carregar permissões</div>';
  }
}

function selectAllPermissions() {
  document.querySelectorAll('.permission-checkbox').forEach(cb => {
    cb.checked = true;
  });
  showToast('Todas as permissões foram marcadas', 'info');
}

function deselectAllPermissions() {
  document.querySelectorAll('.permission-checkbox').forEach(cb => {
    cb.checked = false;
  });
  showToast('Todas as permissões foram desmarcadas', 'info');
}

async function savePermissions(roleId){
  const rows = document.querySelectorAll('.permissions-table tbody tr[data-model]');
  const codenames = [];
  
  rows.forEach(row => {
    const model = row.dataset.model;
    const add = row.querySelector('input[name="add"]')?.checked;
    const change = row.querySelector('input[name="change"]')?.checked;
    const del = row.querySelector('input[name="delete"]')?.checked;
    const view = row.querySelector('input[name="view"]')?.checked;
    
    if(add) codenames.push('add_' + model);
    if(change) codenames.push('change_' + model);
    if(del) codenames.push('delete_' + model);
    if(view) codenames.push('view_' + model);
  });

  const saveBtn = document.getElementById('save-perms');
  const originalText = saveBtn.innerHTML;
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Salvando...';

  try {
    const res = await fetch("{% url 'empresas:role_permissions' role_id=0 %}".replace('/0/','/'+roleId+'/'), {
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRFToken': getCookie('csrftoken')},
      body: JSON.stringify({'permissions': codenames})
    });
    const r = await res.json();
    if(r.ok){
      showToast('✅ Permissões atualizadas com sucesso!', 'success');
    } else {
      showToast('❌ Erro ao atualizar permissões', 'danger');
    }
  } catch(e) {
    showToast('❌ Erro ao salvar permissões', 'danger');
  } finally {
    saveBtn.disabled = false;
    saveBtn.innerHTML = originalText;
  }
}

function getCurrentPermissionsObject(){
  const rows = document.querySelectorAll('.permissions-table tbody tr[data-model]');
  const exportData = {};
  
  rows.forEach(row => {
    const model = row.dataset.model;
    exportData[model] = {
      add: row.querySelector('input[name="add"]')?.checked || false,
      change: row.querySelector('input[name="change"]')?.checked || false,
      delete: row.querySelector('input[name="delete"]')?.checked || false,
      view: row.querySelector('input[name="view"]')?.checked || false,
    }
  });
  
  return exportData;
}

function exportPermissions(){
  const exportData = getCurrentPermissionsObject();
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(exportData, null, 2));
  a.download = 'role-permissions.json';
  a.click();
}

async function saveAsTemplate(roleId){
  const name = prompt('Nome do template:');
  if(!name) return;
  const saveBtn = document.getElementById('save-template');
  const saveLoader = document.getElementById('save-template-loading');
  if(saveBtn) saveBtn.disabled = true;
  if(saveLoader) saveLoader.classList.remove('visually-hidden');

  const dataObj = getCurrentPermissionsObject();
  const url = "{% url 'empresas:save_permission_template' role_id=0 %}".replace('/0/','/'+roleId+'/');
  try{
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type':'application/json','X-CSRFToken': getCookie('csrftoken')},
      body: JSON.stringify({'nome': name, 'dados': dataObj})
    });
    const r = await res.json();
    if(r.ok){
      showToast('Template salvo com sucesso', 'success');
      await loadTemplatesIntoSelect(roleId);
      await loadTemplatesIntoBulkSelect();
    } else {
      showToast('Erro ao salvar template', 'danger');
    }
  }catch(e){
    showToast('Erro ao salvar template', 'danger');
  }finally{
    if(saveBtn) saveBtn.disabled = false;
    if(saveLoader) saveLoader.classList.add('visually-hidden');
  }
}

async function loadTemplatesIntoSelect(roleId){
  const url = "{% url 'empresas:permission_templates_list' %}";
  const sel = document.getElementById('template-select');
  const loader = document.getElementById('template-loading');
  const applyBtn = document.getElementById('apply-template');
  if(!sel) return;

  // Show loading
  sel.innerHTML = '<option>Carregando...</option>';
  if(loader) loader.classList.remove('visually-hidden');
  if(applyBtn) applyBtn.disabled = true;

  try{
    const res = await fetch(url, {headers:{'X-Requested-With':'XMLHttpRequest'}});
    const data = await res.json();
    sel.innerHTML = '';
    const opt = document.createElement('option'); opt.value=''; opt.text='-- Selecionar Template --'; sel.appendChild(opt);
    (data.templates||[]).forEach(t=>{
      const o = document.createElement('option'); o.value = t.id; o.text = t.nome + (t.criado_por ? ' ('+t.criado_por+')' : '');
      sel.appendChild(o);
    });
    if(applyBtn) applyBtn.disabled = (data.templates || []).length === 0;
  }catch(e){
    sel.innerHTML = '<option value="">Erro ao carregar</option>';
    if(applyBtn) applyBtn.disabled = true;
  }finally{
    if(loader) loader.classList.add('visually-hidden');
  }
} 

async function applySelectedTemplate(roleId){
  const sel = document.getElementById('template-select');
  const id = sel.value;
  if(!id){ showToast('Selecione um template', 'warning'); return; }
  const url = "{% url 'empresas:apply_template_to_role' role_id=0 %}".replace('/0/','/'+roleId+'/');
  const res = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type':'application/json','X-CSRFToken': getCookie('csrftoken')},
    body: JSON.stringify({'template_id': Number(id)})
  });
  const r = await res.json();
  if(r.ok){
    showToast('Template aplicado com sucesso', 'success');
    // reload permissions to reflect changes
    loadPermissions(roleId);
    loadTemplatesIntoBulkSelect();
  } else {
    showToast('Erro ao aplicar template', 'danger');
  }
}

async function loadTemplatesIntoBulkSelect(){
  const url = "{% url 'empresas:permission_templates_list' %}";
  const sel = document.getElementById('bulk-template-select');
  const loader = document.getElementById('bulk-template-loading');
  const bulkBtn = document.getElementById('bulk-apply');
  const status = document.getElementById('bulk-template-status');
  if(!sel) return;

  sel.innerHTML = '<option>Carregando...</option>';
  if(loader) loader.classList.remove('visually-hidden');
  if(bulkBtn) bulkBtn.disabled = true;
  if(status) status.textContent = 'Carregando templates...';

  try{
    const res = await fetch(url, {headers:{'X-Requested-With':'XMLHttpRequest'}});
    const data = await res.json();
    sel.innerHTML = '';
    const opt = document.createElement('option'); opt.value=''; opt.text='-- Selecionar Template para Bulk --'; sel.appendChild(opt);
    (data.templates||[]).forEach(t=>{
      const o = document.createElement('option'); o.value = t.id; o.text = t.nome + (t.criado_por ? ' ('+t.criado_por+')' : '');
      sel.appendChild(o);
    });
    if(bulkBtn) bulkBtn.disabled = (data.templates || []).length === 0;
    if(status) status.textContent = (data.templates||[]).length === 0 ? 'Nenhum template disponível' : '';
  }catch(e){
    sel.innerHTML = '<option value="">Erro ao carregar</option>';
    if(status) status.textContent = 'Erro ao carregar templates';
  }finally{
    if(loader) loader.classList.add('visually-hidden');
  }
} 

document.addEventListener('DOMContentLoaded', function(){
  const btn = document.getElementById('bulk-apply');
  if(btn){
    btn.addEventListener('click', async function(){
      const sel = document.getElementById('bulk-template-select');
      const tplid = sel.value;
      if(!tplid){ showToast('Selecione um template para aplicar', 'warning'); return; }
      const selected = Array.from(document.querySelectorAll('.role-select:checked')).map(cb=>cb.dataset.roleId);
      if(selected.length === 0){ showToast('Selecione ao menos uma função', 'warning'); return; }
      const res = await fetch("{% url 'empresas:apply_template_bulk' %}", {
        method: 'POST',
        headers: {'Content-Type':'application/json','X-CSRFToken': getCookie('csrftoken')},
        body: JSON.stringify({'template_id': Number(tplid), 'role_ids': selected})
      });
      const r = await res.json();
      if(r.ok){ showToast(`Template aplicado a ${r.roles_updated} funções`, 'success'); loadTemplatesIntoBulkSelect(); } else { showToast('Erro no bulk apply', 'danger'); }
    });
  }
});

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function showToast(message, type='info'){
  // Update aria-live region
  const region = document.getElementById('status-message');
  if(region){
    region.textContent = message;
    region.classList.remove('visually-hidden');
    region.classList.add('d-block');
    setTimeout(()=>{
      region.classList.add('visually-hidden');
      region.textContent = '';
    }, 4000);
  }

  // Cria um toast bonito e moderno
  const toastContainer = document.getElementById('toast-container') || createToastContainer();
  
  const toast = document.createElement('div');
  toast.className = `toast-modern toast-${type} show`;
  toast.setAttribute('role', 'alert');
  
  const icons = {
    'success': '<i class="bi bi-check-circle-fill"></i>',
    'danger': '<i class="bi bi-x-circle-fill"></i>',
    'warning': '<i class="bi bi-exclamation-triangle-fill"></i>',
    'info': '<i class="bi bi-info-circle-fill"></i>'
  };
  
  toast.innerHTML = `
    <div class="toast-icon">${icons[type] || icons['info']}</div>
    <div class="toast-message">${message}</div>
    <button type="button" class="toast-close" onclick="this.parentElement.remove()">
      <i class="bi bi-x"></i>
    </button>
  `;
  
  toastContainer.appendChild(toast);
  
  // Animação de entrada
  setTimeout(() => toast.classList.add('toast-show'), 10);
  
  // Remove após 4 segundos
  setTimeout(() => {
    toast.classList.remove('toast-show');
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}
