{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agrisdata{% endblock %}</title>
    <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32x32.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f7fafd; }
        .sidebar {
            min-height: 100vh;
            background: #fff;
            border-right: 1px solid #e5e7eb;
            width: 250px;
            position: fixed;
            top: 0; left: 0;
            z-index: 100;
        }
        .main-content {
            margin-left: 250px;
            padding: 2rem 2rem 2rem 2rem;
        }
        .sidebar .nav-link.active {
            background: #e8f0fe;
            color: #1976d2;
            font-weight: 600;
        }
        .sidebar .nav-link {
            color: #333;
        }
        .sidebar .nav-link:hover {
            background: #f1f5fb;
            color: #1976d2;
        }
        .topbar {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 1rem 2rem;
            margin-left: 250px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-metric {
            border-radius: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: none;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include 'partials/sidebar.html' %}
    <div class="topbar">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-shield-check text-primary fs-3"></i>
            <span class="fw-bold fs-5">Agrisdata</span>
        </div>
        <div>
            <span class="me-3">{{ request.user.get_full_name|default:request.user.username }}</span>
            <a href="{% url 'logout' %}" class="btn btn-outline-secondary btn-sm">Sair</a>
        </div>
    </div>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
