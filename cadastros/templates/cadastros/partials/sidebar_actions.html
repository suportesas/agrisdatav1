{% comment %} Sidebar quick actions for entity detail pages {% endcomment %}
<div class="card shadow-sm p-3 mb-3">
  <h6 class="fw-bold">Ações Rápidas</h6>
  <div class="d-grid gap-2 mt-2">
    {% if cliente %}
      <a href="{% url 'cadastros:cliente_contato_create' cliente.pk %}" class="btn btn-outline-primary btn-sm">Adicionar Contato</a>
      <a href="{% url 'cadastros:cliente_endereco_create' cliente.pk %}" class="btn btn-outline-primary btn-sm">Adicionar Endereço</a>
      <a href="{% url 'cadastros:cliente_conta_create' cliente.pk %}" class="btn btn-outline-primary btn-sm">Adicionar Conta</a>
      <a href="{% url 'cadastros:cliente_documento_create' cliente.pk %}" class="btn btn-outline-primary btn-sm">Anexar Documento</a>
      <a href="mailto:{{ cliente.contato_principal_email }}" class="btn btn-outline-secondary btn-sm {% if not cliente.contato_principal_email %}disabled{% endif %}">Enviar e‑mail</a>
      <button type="button" class="btn btn-success btn-sm" id="quickGenerateProposal">Gerar Proposta</button>
    {% elif fornecedor %}
      <a href="{% url 'cadastros:fornecedor_contato_create' fornecedor.pk %}" class="btn btn-outline-primary btn-sm">Adicionar Contato</a>
      <a href="{% url 'cadastros:fornecedor_endereco_create' fornecedor.pk %}" class="btn btn-outline-primary btn-sm">Adicionar Endereço</a>
      <a href="{% url 'cadastros:fornecedor_conta_create' fornecedor.pk %}" class="btn btn-outline-primary btn-sm">Adicionar Conta</a>
      <a href="{% url 'cadastros:fornecedor_documento_create' fornecedor.pk %}" class="btn btn-outline-primary btn-sm">Anexar Documento</a>
    {% endif %}
  </div>
</div>
