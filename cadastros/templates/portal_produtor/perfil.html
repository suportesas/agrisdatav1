{% extends 'portal_produtor/base.html' %}

{% block title %}Meu Perfil{% endblock %}

{% block content %}
<div class="container py-4">
  <h2 class="mb-4"><i class="bi bi-person-circle me-2"></i>Meu Perfil</h2>
  <div class="card mb-4">
    <div class="card-body">
      <dl class="row mb-0">
        <dt class="col-sm-3">Nome</dt>
        <dd class="col-sm-9">{{ request.user.get_full_name|default:request.user.username }}</dd>
        <dt class="col-sm-3">E-mail</dt>
        <dd class="col-sm-9">{{ request.user.email }}</dd>
        <dt class="col-sm-3">Usuário</dt>
        <dd class="col-sm-9">{{ request.user.username }}</dd>
      </dl>
    </div>
  </div>
  <div class="text-end">
    <a href="{% url 'portal_produtor:trocar_senha' %}" class="btn btn-outline-primary">
      <i class="bi bi-key me-1"></i>Alterar Senha
    </a>
  </div>
</div>
{% endblock %}
