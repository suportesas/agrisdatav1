<!-- Card de OS no Kanban de delegação -->
<div class="card border-0 shadow-sm rounded-3 mb-2" style="border-left: 3px solid var(--bs-{{ cor }}) !important;">
  <div class="card-body p-2">
    <div class="d-flex justify-content-between align-items-start gap-1">
      <div style="min-width:0">
        <div class="fw-semibold small text-truncate">
          <a href="{% url 'operacoes_campo:os_detail' os.pk %}" class="text-decoration-none text-dark">
            {{ os.numero }}
          </a>
        </div>
        <div class="text-muted" style="font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
          <i class="bi bi-tools me-1"></i>{{ os.descricao_servico|truncatechars:30 }}
        </div>
        <div class="text-muted" style="font-size:.72rem;">
          <i class="bi bi-geo-alt me-1"></i>{{ os.talhao.nome }}
          {% if os.data_prevista %} · {{ os.data_prevista|date:"d/m" }}{% endif %}
        </div>
        {% if os.responsavel %}
        <div class="mt-1" style="font-size:.72rem;">
          <span class="badge bg-light text-dark border">
            <i class="bi bi-person me-1"></i>{{ os.responsavel.nome_completo|truncatechars:20 }}
          </span>
        </div>
        {% endif %}
      </div>
      <button
        class="btn btn-sm btn-outline-primary rounded-pill flex-shrink-0"
        style="font-size:.7rem;padding:2px 8px;"
        onclick="abrirAtribuicao({{ os.pk }}, '{{ os.numero }}', {{ os.responsavel_id|default:'null' }})"
        title="Atribuir operador">
        <i class="bi bi-person-plus"></i>
      </button>
    </div>
  </div>
</div>
