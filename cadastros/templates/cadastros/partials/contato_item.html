<li class="list-group-item d-flex justify-content-between align-items-center" data-id="{{ c.pk }}">
  <div>
    <strong>{{ c.nome }}</strong> — {{ c.email }} / {{ c.telefone }}
  </div>
  <div>
    <a href="{% url 'cadastros:cliente_contato_update' c.cliente.pk c.pk %}" class="btn btn-sm btn-outline-secondary">Editar</a>
    <a href="{% url 'cadastros:cliente_contato_delete' c.cliente.pk c.pk %}" class="btn btn-sm btn-outline-danger">Excluir</a>
  </div>
</li>
