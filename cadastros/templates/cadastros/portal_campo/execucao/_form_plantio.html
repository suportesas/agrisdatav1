<!-- Campos específicos: Plantio (campo / estufa / viveiro) -->
<div class="row g-2 mb-3">
  <div class="col-6">
    <label class="form-label fw-semibold"><i class="bi bi-tree me-1"></i>Qtd. de Mudas</label>
    <input type="number" name="quantidade_mudas" class="form-control form-control-lg"
           value="{{ registro.quantidade_mudas|default:'' }}" min="0" step="1"
           placeholder="Ex: 500">
  </div>
  <div class="col-6">
    <label class="form-label fw-semibold">Espaçamento (m)</label>
    <input type="number" name="espacamento_m" class="form-control form-control-lg"
           value="{{ registro.espacamento_m|default:'' }}" step="0.01" min="0">
  </div>
</div>
<div class="mb-3">
  <div class="form-check form-switch">
    <input class="form-check-input" type="checkbox" id="plantioEstufa" name="plantio_em_estufa"
           {% if registro.plantio_em_estufa %}checked{% endif %}>
    <label class="form-check-label fw-semibold" for="plantioEstufa">
      <i class="bi bi-house-heart me-1"></i>Plantio em Estufa / Viveiro
    </label>
  </div>
</div>
