{% extends 'base.html' %}

{% block content %}
<div class="container mt-3">
  <div class="card">
    <div class="card-header bg-danger text-white">
      <h5 class="mb-0">Confirmar Exclusão</h5>
    </div>
    <div class="card-body">
      <p>Tem certeza que deseja excluir a natureza de operação:</p>
      <p class="fw-bold">{{ object.codigo }} - {{ object.descricao }}</p>
      
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, excluir</button>
        <a href="{% url 'produtos:naturezaoperacao_list' %}" class="btn btn-secondary ms-2">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
