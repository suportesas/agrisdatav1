<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code — {{ talhao.nome }} | Agrisdata</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #f0f4f0; }
    .etiqueta {
      max-width: 420px;
      margin: 2rem auto;
      background: #fff;
      border: 2px solid #1a7a3c;
      border-radius: 14px;
      padding: 2rem;
      text-align: center;
    }
    .etiqueta .fazenda { color: #6c757d; font-size: .9rem; text-transform: uppercase; letter-spacing: .05em; }
    .etiqueta .nome { color: #1a7a3c; font-weight: 700; font-size: 1.6rem; margin: .25rem 0; }
    .etiqueta .codigo { color: #333; font-size: 1.1rem; margin-bottom: 1rem; }
    .etiqueta img { width: 100%; max-width: 280px; height: auto; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .etiqueta { border-width: 1.5px; margin: 0 auto; box-shadow: none; }
    }
  </style>
</head>
<body class="p-4">

  <div class="no-print d-flex justify-content-center mb-3">
    <button onclick="window.print()" class="btn btn-success">
      <i class="bi bi-printer"></i> Imprimir / Salvar PDF
    </button>
  </div>

  <div class="etiqueta">
    <div class="fazenda">{{ talhao.fazenda.nome }}{% if talhao.area %} · {{ talhao.area.nome }}{% endif %}</div>
    <div class="nome">{{ talhao.nome }}</div>
    {% if talhao.codigo %}<div class="codigo">Código: {{ talhao.codigo }}</div>{% endif %}
    <img src="data:image/png;base64,{{ qr_b64 }}" alt="QR Code do talhão {{ talhao.nome }}">
    <div class="text-muted small mt-2">Escaneie este código ao iniciar uma OS neste talhão</div>
  </div>

</body>
</html>
