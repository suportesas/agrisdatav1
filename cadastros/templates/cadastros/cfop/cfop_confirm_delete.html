{% extends 'base.html' %}

{% block content %}
<div class="container mt-3">
  <h1>Confirmar exclusão</h1>
  <p>Deseja realmente excluir o CFOP <strong>{{ cfop.codigo }} - {{ cfop.nome }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Excluir</button>
    <a class="btn btn-secondary ms-2" href="{% url 'cadastros:cfop_list' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
